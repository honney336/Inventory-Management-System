{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="flashes">
    {% for category, message in messages %}
    <div class="alert alert--{{ category }}" role="alert">
      <span>{{ message }}</span>
      <button class="alert__close" type="button" data-dismiss aria-label="{{ _('Dismiss') }}">&times;</button>
    </div>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}
