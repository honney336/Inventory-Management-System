{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width:520px;margin:60px auto 0">
  <div class="card__body stack" style="text-align:center">
    <h1 style="font-size:2.6rem;margin:0">{{ code }}</h1>
    <p class="muted">{{ message }}</p>
    <div class="btn-row" style="justify-content:center">
      <a class="btn" href="{{ url_for('dashboard.index') }}">{{ _('Back to dashboard') }}</a>
      <a class="btn btn--ghost" href="{{ url_for('products.index') }}">{{ _('Browse products') }}</a>
    </div>
  </div>
</div>
{% endblock %}
